name: RepoDoctor
description: Score a repository's health (README, license, tests, CI, secret hygiene) and fail the job below a minimum score.
author: eyupcodes
branding:
  icon: heart
  color: green

inputs:
  path:
    description: Repository directory to check, relative to the workspace.
    default: "."
  min-score:
    description: Fail only if the score is below this value (0-100) or a check failed. Empty means any warning fails the job.
    default: ""
  sarif:
    description: "'true' to also write a SARIF 2.1.0 log for code scanning upload."
    default: "false"

outputs:
  score:
    description: The health score, 0-100.
    value: ${{ steps.check.outputs.score }}
  sarif-file:
    description: Path of the SARIF log (empty unless sarif is 'true').
    value: ${{ steps.check.outputs.sarif-file }}

runs:
  using: composite
  steps:
    - name: Install RepoDoctor
      shell: bash
      run: python -m pip install --disable-pip-version-check --quiet "$GITHUB_ACTION_PATH"

    - name: Check the repository
      id: check
      shell: bash
      env:
        TARGET: ${{ inputs.path }}
        MIN_SCORE: ${{ inputs.min-score }}
        WANT_SARIF: ${{ inputs.sarif }}
      run: |
        args=()
        if [ -n "$MIN_SCORE" ]; then args+=(--min-score "$MIN_SCORE"); fi
        # The JSON run only reads the score; the last run decides the job result.
        json="$RUNNER_TEMP/repodoctor.json"
        set +e
        repodoctor check "$TARGET" --json > "$json"
        status=$?
        set -e
        if [ "$status" -ge 2 ]; then cat "$json"; exit "$status"; fi
        python -c 'import json,sys; print("score=%d" % json.load(open(sys.argv[1]))["score"])' "$json" >> "$GITHUB_OUTPUT"
        sarif_file=""
        if [ "$WANT_SARIF" = "true" ]; then
          sarif_file="$RUNNER_TEMP/repodoctor.sarif"
          set +e
          repodoctor check "$TARGET" --sarif > "$sarif_file"
          set -e
        fi
        echo "sarif-file=$sarif_file" >> "$GITHUB_OUTPUT"
        repodoctor check "$TARGET" "${args[@]}"
